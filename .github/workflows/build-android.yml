name: Build Frame Window

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  build:
    name: Build Android ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - Android32
          - Android64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build Geode mod
        uses: geode-sdk/build-geode-mod@main
        with:
          target: ${{ matrix.target }}
          combine: true

  package:
    name: Package Android builds
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Combine builds
        id: combine
        uses: geode-sdk/build-geode-mod/combine@main

      - name: Upload .geode artifact
        uses: actions/upload-artifact@v7
        with:
          name: Frame-Window-Android
          path: ${{ steps.combine.outputs.build-output }}/*.geode
          if-no-files-found: error
          retention-days: 14
