name: Build Frame Window

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: write

jobs:
  build:
    name: Build Android ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [Android32, Android64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Geode mod
        uses: geode-sdk/build-geode-mod@main
        with:
          target: ${{ matrix.target }}
          sdk: given
          combine: true

  package:
    name: Combine Android builds
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Combine .geode files
        id: combine
        uses: geode-sdk/build-geode-mod/combine@main

      - name: Upload installable mod
        uses: actions/upload-artifact@v4
        with:
          name: Frame-Window-Android
          path: ${{ steps.combine.outputs.build-output }}/*.geode
          if-no-files-found: error
          retention-days: 14
